# The one thing published to the host. Both Rust services sit behind it on a
# private network with no ports of their own, so this file is the entire surface
# the outside can reach.

server {
    listen 80;
    server_name _;

    # nginx defaults this to 1m, which would reject a data set long before the
    # backend's own 32 MB limit ever applied — and with nginx's own 413, so the
    # backend would never see it.
    client_max_body_size 32m;

    # A training run holds the connection open for the whole descent. The 60s
    # default cuts off a large loop_count part-way and answers 504.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The trailing slash on proxy_pass strips the matched prefix, so
    # /api/linear-regression/train arrives at the backend as /train.
    location /api/linear-regression/ {
        proxy_pass http://learn-model:3000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The built Angular app, when a dist/ is mounted here. Served from the same
    # origin as the API above, so the browser sends no preflight and the
    # backend's CORS headers stop mattering. `ng serve` on :4200 is still a
    # different origin and still needs them — see ALLOWED_ORIGINS.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
