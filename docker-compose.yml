# Runs the training chain with exactly one way in.
#
# Neither Rust service publishes a port. They are reachable only from this
# compose network, which means only from `gateway`, and `gateway` itself is
# published to 127.0.0.1 — so nothing off this machine can reach any of it.
#
# Note that the two services listen on 0.0.0.0 *inside* their containers. That
# is not a hole: a container bound to loopback is unreachable from its own host
# and from every other container, so binding loopback here would simply break
# the chain. Privacy comes from publishing nothing, and from the 127.0.0.1 on
# the one mapping that exists.
#
# Build the scaler's image first, from its own directory:
#   docker build -t data_manipulate_api ../data_manipulate_api

services:
  data-manipulate:
    image: data_manipulate_api
    environment:
      BIND_ADDR: 0.0.0.0:3001
    networks:
      - training
    restart: unless-stopped

  learn-model:
    build: .
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATA_MANIPULATE_URL: http://data-manipulate:3001/manipulate-datas
      # Only needed while the frontend is served by `ng serve` on another
      # origin. Behind the gateway the page and the API share one.
      ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      - data-manipulate
    networks:
      - training
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    # Host side pinned to loopback. Dropping the 127.0.0.1: prefix would publish
    # on every interface and undo the isolation this file exists for.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Drop an Angular build here to serve it from the same origin as the API:
      # - ../../angularProjects/bozlak-dev/dist/bozlak-dev/browser:/usr/share/nginx/html:ro
    depends_on:
      - learn-model
    networks:
      - training
    restart: unless-stopped

networks:
  training:
    driver: bridge
